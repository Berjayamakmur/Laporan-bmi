<!DOCTYPE html>
<html lang="id">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laporan Harian - PT. Berjaya Makmur Indonesia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
:root{--green:#2F7D5B;--green-d:#256A4B;--cream:#FDF1E6;--peach:#FDF3EA;--gold:#D9BE8A;--gold-l:#E4CF9E;--ink:#2B2B2B;--mute:#9A9A9A;--line:#F0E6DB;--rose:#E8A5A5;--bar:#F1E3C8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Poppins','Segoe UI',Roboto,Arial,sans-serif;background:var(--cream);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
[hidden]{display:none!important}
.ic{width:20px;height:20px;flex:none}

/* ---------- Login ---------- */
.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{width:100%;max-width:400px;background:#fff;border-radius:28px;padding:34px 30px;box-shadow:0 24px 60px rgba(120,90,50,.15)}
.login-logo{text-align:center;margin-bottom:22px}
.login-logo img{display:block;width:78%;max-width:280px;height:auto;margin:0 auto 10px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
.login-card h1{font-size:18px;line-height:1.3}
.login-card p.sub{color:var(--mute);font-size:13px}

/* ---------- Form controls ---------- */
.lbl{display:block;font-size:12px;font-weight:500;color:#6b6b6b;margin:12px 0 6px}
.inp{width:100%;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:11px 13px;font-family:inherit;font-size:14px;color:var(--ink);transition:border-color .2s,box-shadow .2s;outline:none}
.inp:hover{border-color:var(--gold)}
.inp:focus{border-color:var(--green);box-shadow:0 0 0 4px rgba(47,125,91,.14)}
.inp:disabled{background:#faf6f1;color:#8a8a8a}
textarea.inp{resize:vertical;min-height:44px}
.pw{position:relative}
.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--mute);font-size:12px;padding:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;font-weight:600;font-size:14px;transition:transform .15s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(47,125,91,.22)}
.btn:active{transform:translateY(0)}
.btn:focus-visible,.ib:focus-visible,.nav-i:focus-visible{outline:3px solid rgba(47,125,91,.35);outline-offset:2px}
.btn-p{background:var(--green);color:#fff}
.btn-p:hover{background:var(--green-d)}
.btn-g{background:var(--gold-l);color:#fff}
.btn-g:hover{box-shadow:0 8px 18px rgba(217,190,138,.45)}
.btn-l{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn-d{background:#d9675d;color:#fff}
.btn[disabled]{opacity:.6;pointer-events:none}
.btn-block{width:100%;margin-top:18px}
.ib{width:34px;height:34px;border-radius:10px;border:0;background:var(--peach);color:var(--green);display:inline-grid;place-items:center;transition:background .2s,transform .15s}
.ib:hover{background:var(--green);color:#fff;transform:translateY(-1px)}
.ib.danger{color:#c0584f}
.ib.danger:hover{background:#c0584f;color:#fff}
.ib .ic{width:17px;height:17px}

/* ---------- Frame & Sidebar ---------- */
.frame{display:flex;height:calc(100vh - 48px);max-width:1520px;margin:24px auto;background:#fff;border-radius:32px;overflow:hidden;box-shadow:0 30px 70px rgba(150,110,60,.18)}
.side{width:230px;flex:none;background:var(--green);color:#fff;padding:26px 0 22px 16px;display:flex;flex-direction:column;position:relative;z-index:30}
.brand{display:flex;flex-direction:column;gap:8px;padding:0 16px 22px 0}
.brand-logo{background:#fff;border-radius:14px;padding:8px 12px}
.brand-logo img{display:block;width:100%;height:auto}
.brand small{font-weight:500;font-size:10px;opacity:.85;letter-spacing:.6px;text-align:center}
.nav{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.nav-i{position:relative;display:flex;align-items:center;gap:12px;padding:13px 18px;border-radius:26px 0 0 26px;color:rgba(255,255,255,.88);font-size:14px;font-weight:500;cursor:pointer;transition:background .2s,color .2s;user-select:none}
.nav-i:hover{background:rgba(255,255,255,.12);color:#fff}
.nav-i.active{background:#fff;color:var(--green);font-weight:600}
.nav-i.active::before,.nav-i.active::after{content:"";position:absolute;right:0;width:26px;height:26px;pointer-events:none}
.nav-i.active::before{top:-26px;background:radial-gradient(circle at 0 0,transparent 26px,#fff 26.5px)}
.nav-i.active::after{bottom:-26px;background:radial-gradient(circle at 0 100%,transparent 26px,#fff 26.5px)}
.nav-sep{height:1px;background:rgba(255,255,255,.22);margin:22px 16px 18px 6px}
.nav-bot{margin-top:auto}
.main{flex:1;min-width:0;overflow-y:auto;background:#fff;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:24px 30px 6px}
.top h2{font-size:21px;font-weight:600}
.crumb{color:var(--mute);font-size:12px;margin-top:2px}
.top-r{display:flex;align-items:center;gap:14px}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--gold-l);color:#fff;display:grid;place-items:center;font-weight:600;font-size:14px}
.me{display:flex;align-items:center;gap:10px}
.me b{font-size:13px;display:block;font-weight:600}
.me span{font-size:11px;color:var(--mute)}
.plus{width:42px;height:42px;border-radius:12px;background:var(--green);color:#fff;border:0;display:grid;place-items:center;transition:transform .15s,box-shadow .2s,background .2s}
.plus:hover{background:var(--green-d);transform:translateY(-2px);box-shadow:0 10px 20px rgba(47,125,91,.3)}
#btnMenu{display:none;width:40px;height:40px;border-radius:12px;border:0;background:var(--peach);color:var(--green);place-items:center}
#content{padding:14px 30px 36px}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:25;opacity:0;pointer-events:none;transition:opacity .25s}
#overlay.show{opacity:1;pointer-events:auto}

/* ---------- Cards & grid ---------- */
.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 8px 30px rgba(120,90,50,.09);border:1px solid #fbf5ee;transition:box-shadow .2s,transform .2s}
.card:hover{box-shadow:0 12px 34px rgba(120,90,50,.13)}
.card h3{font-size:14px;font-weight:600;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.chip{font-size:11px;font-weight:500;color:#a8812f;background:#fbf1dc;border-radius:20px;padding:4px 10px}
.g{display:grid;gap:18px;margin-top:18px}
.g-kpi{grid-template-columns:repeat(5,minmax(0,1fr))}
.g-12{grid-template-columns:minmax(0,1fr) minmax(0,2fr)}
.g-2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.kpi{background:var(--peach);border-radius:18px;padding:16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;box-shadow:0 4px 16px rgba(150,110,60,.07);transition:transform .2s,box-shadow .2s}
.kpi:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(150,110,60,.14)}
.kpi .ico{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;color:var(--green)}
.kpi b{font-size:24px;font-weight:700;line-height:1.1}
.kpi span{font-size:12px;color:#7a7a7a}
.kpi.k-pr .ico{color:#b58a2b}.kpi.k-tn .ico{color:#c0584f}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.filters .f{display:flex;flex-direction:column;min-width:130px;flex:1}
.filters .f .lbl{margin:0 0 4px}
.filters .inp{padding:9px 11px;font-size:13px}
.chart-box{position:relative;height:240px}
.donut-wrap{position:relative;height:200px;max-width:240px;margin:0 auto}
.donut-c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.donut-c b{font-size:30px;font-weight:600;display:block;line-height:1}
.donut-c span{font-size:10px;letter-spacing:1px;color:var(--gold);text-transform:uppercase}
.legend{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12px;color:#6b6b6b}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.pb{margin-bottom:14px}
.pb .pbh{display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px}
.pb .pbh b{font-size:15px;font-weight:600}
.track{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.fill{height:100%;border-radius:6px;transition:width .6s ease}
.belum{max-height:250px;overflow:auto}
.bl{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.bl:last-child{border:0}
.bl .avatar{width:32px;height:32px;font-size:12px;background:var(--bar);color:#a8812f}
.bl small{color:var(--mute);display:block;font-size:11px}
.empty{padding:28px 10px;text-align:center;color:var(--mute);font-size:13px}

/* ---------- Tabel ---------- */
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:11px;font-weight:500;color:var(--mute);padding:10px 8px;border-bottom:1px solid var(--line);text-transform:uppercase;letter-spacing:.4px}
.tbl td{padding:12px 8px;border-bottom:1px solid #f7f0e8;font-size:13px;vertical-align:middle}
.tbl tr{transition:background .15s}
.tbl tbody tr:hover{background:#fffaf4}
.tbl tr.pending{opacity:.55}
.tbl .acts{white-space:nowrap}
.tbl .acts .ib{margin-left:4px}
.sub{color:var(--mute);font-size:11px}
.badge{display:inline-block;font-size:11px;font-weight:500;padding:4px 10px;border-radius:20px;margin:1px 2px 1px 0;white-space:nowrap}
.b-ok{background:#e3f3ea;color:#2f7d5b}.b-pr{background:#fbf1dc;color:#a8812f}.b-tn{background:#fce6e6;color:#c0584f}
.sentinel{text-align:center;padding:16px;color:var(--mute);font-size:12px}

/* ---------- Form laporan ---------- */
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.item{border:1.5px solid var(--line);border-radius:16px;padding:14px 16px 16px;margin-bottom:14px;background:#fffdfa;transition:border-color .2s}
.item:hover{border-color:var(--gold)}
.item-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
.fbox{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:12px}
.fbox a{color:var(--green);font-weight:500;word-break:break-all}
.upl{display:inline-flex;align-items:center;gap:6px;background:var(--peach);color:var(--green);border-radius:10px;padding:8px 12px;font-weight:500;cursor:pointer;transition:background .2s}
.upl:hover{background:#f8e6d3}
.upl input{display:none}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;width:100%}
.thumb{position:relative;width:96px;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;font-size:10px;text-align:center}
.thumb a{display:block;color:var(--ink);text-decoration:none}
.thumb img{display:block;width:100%;height:72px;object-fit:cover}
.thumb .fi{height:72px;display:grid;place-items:center;color:var(--green);background:var(--peach)}
.thumb .tn{display:block;padding:3px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#6b6b6b}
.thumb.ld{display:grid;place-items:center;height:96px;color:var(--mute)}
.tx{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:13px;line-height:1;display:grid;place-items:center;transition:background .2s}
.tx:hover{background:#c0584f}
img.avatar{display:block;object-fit:cover}
.prof{display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0 2px;text-align:center}
.prof .avatar{width:104px;height:104px;font-size:32px}
.prof-act{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}

/* ---------- Modal & Toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(30,25,20,.45);z-index:80;display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s}
.modal{background:#fff;border-radius:22px;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:22px 24px;box-shadow:0 30px 70px rgba(0,0,0,.25);animation:pop .25s}
.modal.wide{max-width:760px}
.modal h3{font-size:17px;margin-bottom:4px}
.modal .mf{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}
.vitem{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}
.vitem p{margin-top:6px;font-size:13px;line-height:1.5}
.vitem .k{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.4px;margin-top:8px}
#toastRoot{position:fixed;top:18px;right:18px;z-index:99;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--green);color:#fff;padding:12px 18px;border-radius:14px;font-size:13px;box-shadow:0 12px 30px rgba(0,0,0,.2);animation:slide .3s;max-width:340px}
.toast.err{background:#c0584f}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes slide{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.skel{height:14px;border-radius:8px;background:linear-gradient(90deg,#f6ede2,#fbf6ef,#f6ede2);background-size:200% 100%;animation:sh 1.2s infinite;margin:10px 0}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- Print ---------- */
#printArea{display:none}
.p-kop{display:flex;align-items:center;gap:16px;border-bottom:4px double #1f2a7a;padding-bottom:10px;margin-bottom:10px}
.p-kop img{width:150px;height:auto;flex:none}
.p-info{flex:1;text-align:center}
.p-name{font-size:17px;font-weight:700;letter-spacing:.4px;color:#1f2a7a}
.p-addr{font-size:11px;margin-top:2px;line-height:1.35}
.p-title{text-align:center;font-size:14px;font-weight:700;text-decoration:underline;margin:6px 0 14px;letter-spacing:.3px}
.p-id{width:100%;font-size:12px;margin-bottom:12px}
.p-id td{padding:2px 6px 2px 0}
.p-tbl{width:100%;border-collapse:collapse;font-size:11px}
.p-tbl th,.p-tbl td{border:1px solid #777;padding:5px 6px;text-align:left;vertical-align:top}
.p-tbl th{background:#eee}
.p-tbl thead{display:table-header-group}
.p-tbl tr{page-break-inside:avoid}
.p-idwrap{display:flex;gap:14px;align-items:flex-start}
.p-foto{width:76px;height:96px;object-fit:cover;border:1px solid #777;flex:none}
.p-gh{font-size:11px;font-weight:700;margin:10px 0 4px}
.p-gal{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.p-gal figure{width:calc(33.3% - 6px);page-break-inside:avoid}
.p-gal img{display:block;width:100%;height:150px;object-fit:cover;border:1px solid #999}
.p-gal figcaption{font-size:9px;text-align:center;color:#444;margin-top:2px}
.p-sign{display:flex;justify-content:space-between;margin-top:36px;font-size:12px;text-align:center}
.p-sign div{width:40%}
.p-sign .sp{height:64px}
@media print{
  html,body{background:#fff;height:auto}
  #viewApp,#viewLogin,#modalRoot,#toastRoot,#overlay{display:none!important}
  #printArea{display:block!important;color:#000;font-family:Arial,sans-serif}
  @page{size:A4;margin:14mm}
}

/* ---------- Responsif ---------- */
@media(max-width:1100px){.g-kpi{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:900px){
  .frame{height:100vh;height:100dvh;margin:0;border-radius:0;max-width:none}
  .side{position:fixed;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .25s;width:250px;box-shadow:10px 0 30px rgba(0,0,0,.2)}
  .side.open{transform:none}
  #btnMenu{display:grid}
  .g-12,.g-2{grid-template-columns:minmax(0,1fr)}
  .top{padding:16px 16px 4px}
  #content{padding:10px 16px 28px}
  .me .mt{display:none}
}
@media(max-width:760px){
  .g-kpi{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row2,.row3{grid-template-columns:1fr}
  .top h2{font-size:17px}
  .tbl thead{display:none}
  .tbl,.tbl tbody,.tbl tr,.tbl td{display:block;width:100%}
  .tbl tr{border:1px solid var(--line);border-radius:14px;padding:8px 12px;margin-bottom:10px;background:#fff}
  .tbl td{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;padding:5px 0;text-align:right}
  .tbl td::before{content:attr(data-label);color:var(--mute);font-size:11px;text-align:left;flex:none}
  .modal{padding:18px 16px;border-radius:20px}
  #toastRoot{top:auto;bottom:14px;right:12px;left:12px}
  .toast{max-width:none}
}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="viewLogin" class="login-wrap" hidden>
  <form class="login-card" onsubmit="event.preventDefault();doLogin();" autocomplete="off">
    <div class="login-logo">
      <img id="loginLogo" alt="Berjaya Makmur Indonesia">
      <p class="sub">Laporan Harian Pekerjaan - PT. BERJAYA MAKMUR INDONESIA</p>
    </div>
    <label class="lbl" for="lgUser">ID Pengguna</label>
    <input id="lgUser" class="inp" type="text" placeholder="Masukkan ID" autocapitalize="none" autocomplete="username">
    <label class="lbl" for="lgPass">Password</label>
    <div class="pw">
      <input id="lgPass" class="inp" type="password" placeholder="Masukkan password" autocomplete="current-password">
      <button type="button" id="lgToggle">Lihat</button>
    </div>
    <button id="lgBtn" class="btn btn-p btn-block" type="submit">Masuk</button>
    <button id="lgPreview" class="btn btn-l btn-block" type="button" hidden>Lihat tampilan (mode preview)</button>
  </form>
</div>

<!-- ================= APLIKASI ================= -->
<div id="viewApp" class="frame" hidden>
  <aside class="side" id="side">
    <div class="brand"><div class="brand-logo"><img id="sideLogo" alt="Berjaya Makmur Indonesia"></div><small>LAPORAN HARIAN PEKERJAAN</small></div>
    <nav class="nav" id="nav"></nav>
    <div class="nav-sep"></div>
    <nav class="nav nav-bot">
      <a class="nav-i" tabindex="0" data-act="pw"><span data-ic="key"></span>Ubah Password</a>
      <a class="nav-i" tabindex="0" data-act="logout"><span data-ic="logout"></span>Keluar</a>
    </nav>
  </aside>
  <main class="main" id="main">
    <header class="top">
      <div style="display:flex;align-items:center;gap:12px;min-width:0">
        <button id="btnMenu" aria-label="Menu" data-act="menu"><span data-ic="menu"></span></button>
        <div style="min-width:0"><h2 id="pgTitle"></h2><div class="crumb" id="pgCrumb"></div></div>
      </div>
      <div class="top-r">
        <div class="me" data-act="profile" title="Profil saya" style="cursor:pointer"><span id="meAv"></span><div class="mt"><b id="meName"></b><span id="meRole"></span></div></div>
        <button class="plus" id="btnNew" title="Buat laporan" data-act="new"><span data-ic="plus"></span></button>
      </div>
    </header>
    <section id="content"></section>
  </main>
</div>
<div id="overlay" data-act="menu"></div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<div id="printArea"></div>

<script>
// =====================================================================
// Frontend Laporan Harian - PT. BERJAYA MAKMUR INDONESIA
// Catatan: tanpa template literal (backtick), HTML dirakit dengan concatenation.

// ---------- API ----------
function emptyKpi() { return { laporan: 0, pekerjaan: 0, selesai: 0, progres: 0, tunda: 0, pctSelesai: 0, karyawanAktif: 0, sudahLapor: 0, belumLapor: 0 }; }
function previewReply(action) {
  if (action === 'dashboard') { return { ok: true, range: { from: todayDMY(), to: todayDMY() }, kpi: emptyKpi(), perDivisi: [], perHari: [], belum: [], recent: [] }; }
  if (action === 'reports' || action === 'users') { return { ok: true, rows: [], total: 0, hasMore: false }; }
  if (action === 'rekap') { return { ok: true, bulan: todayDMY().substr(3), from: '', to: '', hariKerja: 0, divisi: '', summary: { laporan: 0, pekerjaan: 0, selesai: 0, progres: 0, tunda: 0, pctSelesai: 0, pctLapor: 0, karyawan: 0 }, perDivisi: [], karyawan: [], kendala: [] }; }
  if (action === 'karyawanOpts') { return { ok: true, rows: [] }; }
  if (action === 'myStats') { return { ok: true, kpi: emptyKpi() }; }
  return { ok: false, msg: 'Mode preview: backend belum aktif. Deploy ke Apps Script untuk fitur penuh.' };
}
function callApi(action, payload, cb) {
  if (!IS_GAS) { setTimeout(function () { cb(previewReply(action)); }, 80); return; }
  google.script.run
    .withSuccessHandler(function (res) {
      if (res && res.auth) { forceLogout(res.msg); return; }
      cb(res || { ok: false, msg: 'Respon kosong dari server.' });
    })
    .withFailureHandler(function (err) {
      cb({ ok: false, msg: (err && err.message) ? err.message : 'Gagal terhubung ke server.' });
    })
    .api(action, S.token, payload || {});
}

// ---------- Login / Logout ----------
function doLogin() {
  var u = $('lgUser').value.trim();
  var p = $('lgPass').value;
  if (!u || !p) { toast('ID dan password wajib diisi', 'err'); return; }
  $('lgBtn').disabled = true;
  $('lgBtn').textContent = 'Memeriksa...';
  callApi('login', { username: u, password: p }, function (res) {
    $('lgBtn').disabled = false;
    $('lgBtn').textContent = 'Masuk';
    if (!res.ok) { toast(res.msg, 'err'); return; }
    S.token = res.token; S.user = res.user; S.cfg = res.cfg;
    store('bmi_token', res.token);
    $('lgPass').value = '';
    enterApp();
  });
}
function forceLogout(msg) {
  S.token = ''; S.user = null; store('bmi_token', null);
  showLogin();
  if (msg) { toast(msg, 'err'); }
}
function doLogout() {
  var t = S.token;
  if (IS_GAS && t) { callApi('logout', {}, function () {}); }
  S.token = ''; S.user = null; store('bmi_token', null);
  S.reports = []; S.rLoaded = false; S.users = []; S.uLoaded = false; S.dash = null; S.dashDirty = true; S.karyawanOpts = null;
  showLogin();
}
function showLogin() {
  $('viewApp').hidden = true;
  $('viewLogin').hidden = false;

}
function enterApp() {

  $('viewApp').hidden = false;

  $('meName').textContent = S.user.nama;
  $('meRole').textContent = S.user.role === 'Admin' ? 'Administrator' : S.user.divisi + ' - ' + S.user.jabatan;

  if (canMonitor()) { nav += navItem('dash', 'dash', 'Dashboard'); }
  nav += navItem('laporan', 'file', isAdmin() ? 'Laporan' : (isKepala() ? 'Laporan Divisi' : 'Laporan Saya'));
  nav += navItem('form', 'plus', 'Buat Laporan');
  if (canMonitor()) { nav += navItem('rekap', 'chart', 'Rekap Bulanan'); }
  if (isAdmin()) { nav += navItem('karyawan', 'users', 'Karyawan'); }

function navItem(page, icon, label) {

// ---------- Router ----------
function go(page, keepForm) {
  destroyCharts();
  if (S.observer) { S.observer.disconnect(); S.observer = null; }
  S.page = page;
  if (page !== 'form' && !keepForm) { S.form = null; }
  var navs = document.querySelectorAll('[data-nav]');
  for (var i = 0; i < navs.length; i++) {
    var on = navs[i].getAttribute('data-nav') === page || (page === 'form' && navs[i].getAttribute('data-nav') === 'form');
    navs[i].className = 'nav-i' + (on ? ' active' : '');
  }
  $('side').className = 'side';
  $('overlay').className = '';
  $('main').scrollTop = 0;
  $('btnNew').hidden = (page === 'form');
  if (page === 'dash') { $('pgTitle').textContent = 'Dashboard'; $('pgCrumb').textContent = isAdmin() ? 'Ringkasan laporan harian karyawan' : 'Ringkasan laporan divisi ' + S.user.divisi; renderDash(); }
  else if (page === 'laporan') { $('pgTitle').textContent = isAdmin() ? 'Laporan Harian' : (isKepala() ? 'Laporan Divisi ' + S.user.divisi : 'Laporan Saya'); $('pgCrumb').textContent = 'Daftar laporan pekerjaan'; renderLaporan(); }
  else if (page === 'rekap') { $('pgTitle').textContent = 'Rekap Bulanan'; $('pgCrumb').textContent = isAdmin() ? 'Evaluasi per karyawan dan per divisi' : 'Evaluasi anggota divisi ' + S.user.divisi; renderRekap(); }
  else if (page === 'form') { renderForm(); }

}

var PALETTE = ['#2F7D5B', '#D9BE8A', '#E39B7B', '#6FB1A0', '#B9A6D6', '#8FB8DE', '#E6C75A', '#C98BB9'];

function buildCharts() {

    data: { labels: ['Selesai', 'Progres', 'Tunda'], datasets: [{ data: total ? [k.selesai, k.progres, k.tunda] : [1], backgroundColor: total ? ['#2F7D5B', '#D9BE8A', '#E8A5A5'] : ['#F0E6DB'], borderWidth: 0 }] },

    options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, usePointStyle: true } }, tooltip: { enabled: pSum > 0 } } }
  }));

    }

function refreshFileBox(it) {
  var b = $('fb-' + it.uid);
  if (b) { b.innerHTML = fileBoxHtml(it); paintIcons(); }
}
function handleFiles(it, list) {
  var room = MAX_FILES - it.files.length - it.uploadingN;
  if (room <= 0) { toast('Maksimal ' + MAX_FILES + ' file per pekerjaan', 'err'); return; }
  if (list.length > room) { toast('Hanya ' + room + ' file pertama yang diunggah (maks. ' + MAX_FILES + ')', 'err'); }
  var n = Math.min(room, list.length);
  for (var i = 0; i < n; i++) { handleFile(it, list[i]); }
}
function handleFile(it, file) {
  if (!file) { return; }
  var isImg = file.type.indexOf('image/') === 0;
  if (file.size > (isImg ? 12 : 5) * 1048576) { toast('Ukuran file terlalu besar: ' + file.name, 'err'); return; }
  it.uploadingN++; refreshFileBox(it);
  var done = function () { it.uploadingN--; refreshFileBox(it); };
  var finish = function (name, mime, b64, preview) {
    callApi('upload', { name: name, mime: mime, data: b64 }, function (res) {
      if (res.ok) { it.files.push({ url: res.url, name: res.name, preview: preview || '' }); }
      else { toast(res.msg, 'err'); }
      done();
    });
  };
  var fail = function () { done(); toast('Gagal membaca file ' + file.name, 'err'); };
  if (isImg && file.type !== 'image/gif') {
    var img = new Image();
    var url = URL.createObjectURL(file);
    img.onload = function () {
      var sc = Math.min(1, 1280 / Math.max(img.width, img.height));
      var cv = document.createElement('canvas');
      cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      var data = cv.toDataURL('image/jpeg', 0.8);
      var ps = Math.min(1, 160 / Math.max(cv.width, cv.height));
      var pv = document.createElement('canvas');
      pv.width = Math.max(1, Math.round(cv.width * ps)); pv.height = Math.max(1, Math.round(cv.height * ps));
      pv.getContext('2d').drawImage(cv, 0, 0, pv.width, pv.height);
      var preview = pv.toDataURL('image/jpeg', 0.6);
      URL.revokeObjectURL(url);
      finish(file.name.replace(/\.[^.]+$/, '') + '.jpg', 'image/jpeg', data.split(',')[1], preview);
    };
    img.onerror = function () { URL.revokeObjectURL(url); fail(); };
    img.src = url;
  } else {
    var rdr = new FileReader();
    rdr.onload = function () { finish(file.name, file.type || 'application/octet-stream', String(rdr.result).split(',')[1], ''); };
    rdr.onerror = fail;
    rdr.readAsDataURL(file);
  }
}
function calcCounts(items) {
  var c = { selesai: 0, progres: 0, tunda: 0, total: items.length };
  for (var i = 0; i < items.length; i++) {
    if (items[i].status === 'Selesai') { c.selesai++; } else if (items[i].status === 'Progres') { c.progres++; } else if (items[i].status === 'Tunda') { c.tunda++; }
  }
  return c;
}
function submitReport() {
  var F = S.form;
  if (!F) { return; }
  var tgl = F.mode === 'edit' ? F.tanggal : toDMY($('frTgl').value);
  if (!tgl) { toast('Tanggal wajib diisi', 'err'); return; }
  if (dkey(tgl) > dkey(todayDMY())) { toast('Tanggal tidak boleh melebihi hari ini', 'err'); return; }
  var owner = { id: S.user.id, nama: S.user.nama, divisi: S.user.divisi, jabatan: S.user.jabatan };
  if (isAdmin()) {
    if (F.mode === 'edit') { owner = { id: F.userId, nama: F.nama, divisi: F.divisi, jabatan: F.jabatan }; }
    else {
      var sel = $('frUser').value;
      if (!sel) { toast('Pilih karyawan terlebih dahulu', 'err'); return; }
      for (var q = 0; q < S.karyawanOpts.length; q++) { if (S.karyawanOpts[q].id === sel) { owner = S.karyawanOpts[q]; } }
    }
  }
  var rencana = $('frRencana').value;
  var payloadItems = [];
  var localItems = [];
  for (var i = 0; i < F.items.length; i++) {
    var it = F.items[i];
    if (it.uploadingN > 0) { toast('Tunggu upload file selesai', 'err'); return; }
    if (!String(it.deskripsi).trim()) { toast('Deskripsi pekerjaan #' + (i + 1) + ' wajib diisi', 'err'); return; }
    payloadItems.push({ deskripsi: String(it.deskripsi).trim(), status: it.status, kendala: it.kendala, solusi: it.solusi, files: it.files.map(function (f) { return { url: f.url, name: f.name }; }) });
    localItems.push({ id: '', deskripsi: String(it.deskripsi).trim(), status: it.status, kendala: it.kendala, solusi: it.solusi, files: it.files.slice() });
  }

  // Optimistic UI: tampilkan langsung di daftar, lalu sinkron ke server
  var tmp = { id: F.mode === 'edit' ? F.id : '...', tanggal: tgl, userId: owner.id, nama: owner.nama, divisi: owner.divisi, jabatan: owner.jabatan, rencana: rencana, items: localItems, counts: calcCounts(localItems), _pending: true };
  var wasLoaded = S.rLoaded;
  var oldObj = null;
  var oldIdx = -1;
  if (wasLoaded) {
    if (F.mode === 'edit') {
      oldObj = findReport(F.id, tgl);
      oldIdx = S.reports.indexOf(oldObj);
      if (oldIdx >= 0) { S.reports[oldIdx] = tmp; } else { S.reports.unshift(tmp); }
    } else { S.reports.unshift(tmp); S.rTotal++; sortReports(); }
  }
  var payload = { id: F.mode === 'edit' ? F.id : '', tanggal: tgl, userId: owner.id, rencana: rencana, items: payloadItems };
  S.saving++;
  S.dashDirty = true;
  S.form = null;
  go('laporan');
  callApi('reportSave', payload, function (res) {
    S.saving--;
    if (res.ok) {
      var at = S.reports.indexOf(tmp);
      if (at >= 0) { S.reports[at] = res.report; }
      if (!wasLoaded && S.page === 'laporan') { loadReports(true); }
      toast('Laporan berhasil disimpan');
    } else {
      var ix = S.reports.indexOf(tmp);
      if (ix >= 0) {
        if (oldObj) { S.reports[ix] = oldObj; } else { S.reports.splice(ix, 1); S.rTotal = Math.max(0, S.rTotal - 1); }
      }
      if (!wasLoaded && S.page === 'laporan') { loadReports(true); }
      toast(res.msg, 'err');
    }
    if (S.page === 'laporan' && $('rBox')) { renderReportRows(); }
  });
}

// Kompres foto profil jadi JPEG persegi kecil (muat di satu sel Sheets)
function compressProfile(file, cb) {
  var img = new Image();
  var url = URL.createObjectURL(file);
  img.onload = function () {
    var sizes = [200, 160, 128];
    var qs = [0.8, 0.65, 0.5];
    var out = '';
    var side = Math.min(img.width, img.height);
    var sx = (img.width - side) / 2;
    var sy = (img.height - side) / 2;
    for (var a = 0; a < sizes.length && !out; a++) {
      for (var b = 0; b < qs.length; b++) {
        var cv = document.createElement('canvas');
        cv.width = sizes[a]; cv.height = sizes[a];
        var cx = cv.getContext('2d');
        cx.fillStyle = '#fff'; cx.fillRect(0, 0, sizes[a], sizes[a]);
        cx.drawImage(img, sx, sy, side, side, 0, 0, sizes[a], sizes[a]);
        var d = cv.toDataURL('image/jpeg', qs[b]);
        if (d.length <= 42000) { out = d; break; }
      }
    }
    URL.revokeObjectURL(url);
    cb(out);
  };
  img.onerror = function () { URL.revokeObjectURL(url); cb(''); };
  img.src = url;
}

  var u = S.user;

  var list = byDiv ? d.perDivisi : d.karyawan;
  var i;
  var h = '<div class="g g-kpi">' + kpiCard('', 'file', s.laporan, 'Total Laporan') + kpiCard('', 'dash', s.pekerjaan, 'Total Pekerjaan') + kpiCard('', 'check', s.pctSelesai + '%', 'Pekerjaan Selesai') + kpiCard('k-pr', 'clock', s.pctLapor + '%', 'Kepatuhan Lapor') + kpiCard('', 'users', d.hariKerja, 'Hari Kerja') + '</div>';

  h += '<div class="card" style="margin-top:18px"><h3>' + (byDiv ? 'Perbandingan per Divisi' : 'Perbandingan per Karyawan') + ' <span class="chip">' + esc(bulanLabel(d.bulan)) + '</span></h3>';
  if (list.length) { h += '<div style="position:relative;height:' + Math.max(220, list.length * 34 + 60) + 'px"><canvas id="cRk"></canvas></div>'; }
  else { h += '<div class="empty">Belum ada data pada bulan ini.</div>'; }
  h += '</div>';

  var t;
  if (byDiv) {
    t = '<table class="tbl"><thead><tr><th>Divisi</th><th>Karyawan</th><th>Kepatuhan Lapor</th><th>Pekerjaan</th><th>Selesai</th><th>Progres</th><th>Tunda</th><th>% Selesai</th><th>Kendala</th></tr></thead><tbody>';
    for (i = 0; i < list.length; i++) {
      var v = list[i];
      t += '<tr><td data-label="Divisi"><b style="font-weight:500">' + esc(v.divisi) + '</b></td><td data-label="Karyawan">' + v.karyawan + '</td><td data-label="Kepatuhan Lapor">' + pctBadge(v.pctLapor) + '</td><td data-label="Pekerjaan">' + v.pekerjaan + '</td><td data-label="Selesai">' + v.selesai + '</td><td data-label="Progres">' + v.progres + '</td><td data-label="Tunda">' + v.tunda + '</td><td data-label="% Selesai">' + pctBadge(v.pctSelesai) + '</td><td data-label="Kendala">' + v.kendala + '</td></tr>';
    }
  } else {
    t = '<table class="tbl"><thead><tr><th>Nama</th><th>Divisi</th><th>Hari Lapor</th><th>Kepatuhan</th><th>Pekerjaan</th><th>Selesai</th><th>Progres</th><th>Tunda</th><th>% Selesai</th><th>Kendala</th><th></th></tr></thead><tbody>';
    for (i = 0; i < list.length; i++) {
      var x = list[i];
      t += '<tr><td data-label="Nama"><div><b style="font-weight:500">' + esc(x.nama) + '</b><br><span class="sub">' + esc(x.jabatan) + '</span></div></td><td data-label="Divisi">' + esc(x.divisi) + '</td><td data-label="Hari Lapor">' + x.hariLapor + ' / ' + d.hariKerja + '</td><td data-label="Kepatuhan">' + pctBadge(x.pctLapor) + '</td><td data-label="Pekerjaan">' + x.pekerjaan + '</td><td data-label="Selesai">' + x.selesai + '</td><td data-label="Progres">' + x.progres + '</td><td data-label="Tunda">' + x.tunda + '</td><td data-label="% Selesai">' + pctBadge(x.pctSelesai) + '</td><td data-label="Kendala">' + x.kendala + '</td><td data-label="Aksi" class="acts"><button class="ib" title="Cetak rekap karyawan" data-act="rkUser" data-id="' + esc(x.id) + '">' + ic('print') + '</button></td></tr>';
    }
  }
  t += '</tbody></table>';
  h += '<div class="card" style="margin-top:18px"><h3>Rincian Rekap</h3>' + (list.length ? t : '<div class="empty">Belum ada data.</div>') + '</div>';

  h += '<div class="card" style="margin-top:18px"><h3>Kendala dan Solusi <span class="chip">' + d.kendala.length + ' terbaru</span></h3>';
  if (!d.kendala.length) { h += '<div class="empty">Tidak ada kendala tercatat pada bulan ini.</div>'; }
  for (i = 0; i < d.kendala.length; i++) {
    var k = d.kendala[i];
    h += '<div class="vitem"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b style="font-weight:500">' + esc(k.nama) + ' <span class="sub">' + esc(k.tanggal) + ' - ' + esc(k.divisi) + '</span></b>' + badge(k.status) + '</div><p>' + nl2br(k.deskripsi) + '</p><div class="k">Kendala</div><p>' + nl2br(k.kendala) + '</p><div class="k">Solusi</div><p>' + (k.solusi ? nl2br(k.solusi) : '-') + '</p></div>';
  }
  h += '</div>';
  $('rkBody').innerHTML = h;
  paintIcons();

  if (list.length && typeof Chart !== 'undefined' && $('cRk')) {
    var labels = [];
    var pSel = [];
    var pLap = [];
    for (var n = 0; n < list.length; n++) { labels.push(byDiv ? list[n].divisi : list[n].nama); pSel.push(list[n].pctSelesai); pLap.push(list[n].pctLapor); }
    S.charts.push(new Chart($('cRk'), {
      type: 'bar',
      data: { labels: labels, datasets: [
        { label: '% Selesai', data: pSel, backgroundColor: '#2F7D5B', borderRadius: 6, borderSkipped: false },
        { label: 'Kepatuhan Lapor', data: pLap, backgroundColor: '#D9BE8A', borderRadius: 6, borderSkipped: false }
      ] },
      options: {
        indexAxis: 'y', responsive: true, maintainAspectRatio: false,
        plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, usePointStyle: true } } },
        scales: { x: { min: 0, max: 100, ticks: { callback: function (v) { return v + '%'; } }, grid: { color: '#F5EDE3' }, border: { display: false } }, y: { grid: { display: false } } }
      }
    }));
  }
}
function rekapInfo(d) {
  return '<p style="font-size:12px;margin-bottom:8px">Periode: <b>' + esc(bulanLabel(d.bulan)) + '</b> | Divisi: ' + esc(d.divisi || 'Semua') + ' | Hari kerja: ' + d.hariKerja + ' hari | Dicetak: ' + esc(todayDMY()) + '</p>';
}
function rekapSummaryHtml(d) {
  var s = d.summary;
  return '<table class="p-tbl" style="margin-bottom:10px"><tr><th>Total Laporan</th><th>Total Pekerjaan</th><th>Selesai</th><th>Progres</th><th>Tunda</th><th>% Selesai</th><th>Kepatuhan Lapor</th></tr><tr><td>' + s.laporan + '</td><td>' + s.pekerjaan + '</td><td>' + s.selesai + '</td><td>' + s.progres + '</td><td>' + s.tunda + '</td><td>' + s.pctSelesai + '%</td><td>' + s.pctLapor + '%</td></tr></table>';
}
function signBlock(a, b) {
  return '<div class="p-sign"><div>' + esc(a) + '<div class="sp"></div>( ........................ )</div><div>' + esc(b) + '<div class="sp"></div>( ........................ )</div></div>';
}
function buildRekapBulanPrint(d, byDiv) {
  var h = kop('REKAP LAPORAN BULANAN') + rekapInfo(d) + rekapSummaryHtml(d);
  var i;
  if (byDiv) {
    h += '<table class="p-tbl"><thead><tr><th>Divisi</th><th>Karyawan</th><th>Kepatuhan Lapor</th><th>Pekerjaan</th><th>Selesai</th><th>Progres</th><th>Tunda</th><th>% Selesai</th><th>Kendala</th></tr></thead><tbody>';
    for (i = 0; i < d.perDivisi.length; i++) {
      var v = d.perDivisi[i];
      h += '<tr><td>' + esc(v.divisi) + '</td><td>' + v.karyawan + '</td><td>' + v.pctLapor + '%</td><td>' + v.pekerjaan + '</td><td>' + v.selesai + '</td><td>' + v.progres + '</td><td>' + v.tunda + '</td><td>' + v.pctSelesai + '%</td><td>' + v.kendala + '</td></tr>';
    }
  } else {
    h += '<table class="p-tbl"><thead><tr><th>No</th><th>Nama</th><th>Divisi</th><th>Hari Lapor</th><th>Kepatuhan</th><th>Pekerjaan</th><th>Selesai</th><th>Progres</th><th>Tunda</th><th>% Selesai</th><th>Kendala</th></tr></thead><tbody>';
    for (i = 0; i < d.karyawan.length; i++) {
      var x = d.karyawan[i];
      h += '<tr><td>' + (i + 1) + '</td><td>' + esc(x.nama) + '</td><td>' + esc(x.divisi) + '</td><td>' + x.hariLapor + ' / ' + d.hariKerja + '</td><td>' + x.pctLapor + '%</td><td>' + x.pekerjaan + '</td><td>' + x.selesai + '</td><td>' + x.progres + '</td><td>' + x.tunda + '</td><td>' + x.pctSelesai + '%</td><td>' + x.kendala + '</td></tr>';
    }
  }
  h += '</tbody></table>';
  if (d.kendala.length) {
    h += '<p style="font-size:12px;margin:14px 0 6px"><b>Catatan kendala dan solusi</b></p><table class="p-tbl"><thead><tr><th>Tanggal</th><th>Nama</th><th>Pekerjaan</th><th>Kendala</th><th>Solusi</th></tr></thead><tbody>';
    for (var k = 0; k < d.kendala.length && k < 20; k++) {
      var c = d.kendala[k];
      h += '<tr><td>' + esc(c.tanggal) + '</td><td>' + esc(c.nama) + '</td><td>' + nl2br(c.deskripsi) + '</td><td>' + nl2br(c.kendala) + '</td><td>' + (c.solusi ? nl2br(c.solusi) : '-') + '</td></tr>';
    }
    h += '</tbody></table>';
  }
  return h + signBlock('Dibuat oleh', 'Mengetahui');
}
function buildRekapUserPrint(d) {
  var u = d.karyawan[0];
  var h = kop('REKAP LAPORAN BULANAN KARYAWAN');
  h += '<table class="p-id"><tr><td width="110">Nama</td><td>: ' + esc(u.nama) + '</td></tr><tr><td>Divisi / Jabatan</td><td>: ' + esc(u.divisi) + ' / ' + esc(u.jabatan) + '</td></tr><tr><td>Periode</td><td>: ' + esc(bulanLabel(d.bulan)) + '</td></tr><tr><td>Kehadiran lapor</td><td>: ' + u.hariLapor + ' dari ' + d.hariKerja + ' hari kerja (' + u.pctLapor + '%)</td></tr></table>';
  h += rekapSummaryHtml(d);
  h += '<table class="p-tbl"><thead><tr><th>Tanggal</th><th>Pekerjaan</th><th>Status</th><th>Kendala</th><th>Solusi</th></tr></thead><tbody>';
  var lap = d.laporan.slice().reverse();
  for (var i = 0; i < lap.length; i++) {
    for (var j = 0; j < lap[i].items.length; j++) {
      var it = lap[i].items[j];
      h += '<tr><td>' + esc(lap[i].tanggal) + '</td><td>' + nl2br(it.deskripsi) + '</td><td>' + esc(it.status) + '</td><td>' + (it.kendala ? nl2br(it.kendala) : '-') + '</td><td>' + (it.solusi ? nl2br(it.solusi) : '-') + '</td></tr>';
    }
  }
  if (!lap.length) { h += '<tr><td colspan="5" style="text-align:center">Tidak ada laporan pada bulan ini</td></tr>'; }
  h += '</tbody></table>';
  return h + signBlock('Karyawan', 'Mengetahui');
}
function printRekapBulan() {
  if (!S.rk.data) { toast('Data rekap belum tersedia', 'err'); return; }
  printHtml(buildRekapBulanPrint(S.rk.data, isAdmin() && S.rk.mode === 'divisi'));
}
function printRekapUser(id) {
  toast('Menyiapkan rekap...');
  callApi('rekap', { bulan: S.rk.bulan, divisi: S.rk.divisi, userId: id }, function (res) {
    if (!res.ok) { toast(res.msg, 'err'); return; }
    if (!res.karyawan.length) { toast('Data karyawan tidak ditemukan', 'err'); return; }
    printHtml(buildRekapUserPrint(res));
  });
}

// =====================================================================
// EVENT (delegasi)
// =====================================================================
document.addEventListener('click', function (e) {
  var t = e.target;
  if (t.id === 'mbg') { closeModal(); return; }
  var nv = t.closest ? t.closest('[data-nav]') : null;
  if (nv) { go(nv.getAttribute('data-nav') === 'form' ? 'form' : nv.getAttribute('data-nav')); if (nv.getAttribute('data-nav') === 'form') { S.form = null; renderForm(); } return; }
  var lk = t.closest ? t.closest('[data-nav-link]') : null;
  if (lk) { go(lk.getAttribute('data-nav-link')); return; }
  var el = t.closest ? t.closest('[data-act]') : null;
  if (!el) { return; }
  var act = el.getAttribute('data-act');
  var id = el.getAttribute('data-id');
  var tgl = el.getAttribute('data-tgl');
  var r;
  switch (act) {
    case 'menu': $('side').className = $('side').className.indexOf('open') >= 0 ? 'side' : 'side open'; $('overlay').className = $('side').className.indexOf('open') >= 0 ? 'show' : ''; break;
    case 'logout': doLogout(); break;
    case 'pw': openPwModal(); break;
    case 'mclose': closeModal(); break;
    case 'new': S.form = null; startForm(null); break;
    case 'dashApply': S.dashDirty = true; loadDash(); break;
    case 'view': r = findReport(id, tgl); if (r) { viewReport(r); } break;
    case 'edit': r = findReport(id, tgl); if (r && canEditReport(r)) { closeModal(); startForm(r); } break;
    case 'del': r = findReport(id, tgl); if (r && canEditReport(r)) { deleteReport(r); } break;
    case 'print': r = findReport(id, tgl); if (r) { printReport(r); } break;
    case 'rekap': printRekap(); break;
    case 'rkPrint': printRekapBulan(); break;
    case 'profile': openProfile(); break;
    case 'pfDel': removeProfilePhoto(); break;
    case 'umPhotoDel': removeUserPhoto(); break;
    case 'rkUser': printRekapUser(id); break;
    case 'moreR': loadReports(false); break;
    case 'moreU': loadUsers(false); break;
    case 'itemadd': S.form.items.push(newItem()); renderItems(); break;
    case 'itemdel': if (S.form.items.length > 1) { var it = itemByUid(+el.getAttribute('data-u')); S.form.items.splice(S.form.items.indexOf(it), 1); renderItems(); } break;
    case 'filedel': var it2 = itemByUid(+el.getAttribute('data-u')); if (it2) { it2.files.splice(+el.getAttribute('data-i'), 1); refreshFileBox(it2); } break;
    case 'formcancel': go(S.rLoaded || !isAdmin() ? 'laporan' : 'dash'); break;
    case 'uadd': openUserModal(null); break;
    case 'uedit': var u = findUser(id); if (u) { openUserModal(u); } break;
    case 'utoggle': var u2 = findUser(id); if (u2) { toggleUser(u2); } break;
  }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') { closeModal(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target && e.target.classList && e.target.classList.contains('nav-i')) { e.preventDefault(); e.target.click(); }
});
// Isi item form (disimpan di state, tanpa re-render agar fokus tidak hilang)
document.addEventListener('input', function (e) {
  var t = e.target;
  if (t && t.getAttribute && t.getAttribute('data-f') && t.getAttribute('data-u') && t.getAttribute('data-f') !== 'file') {
    var it = itemByUid(+t.getAttribute('data-u'));
    if (it) { it[t.getAttribute('data-f')] = t.value; }
  }
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (!t || !t.id) {
    if (t && t.getAttribute && t.getAttribute('data-f') === 'file') { var it = itemByUid(+t.getAttribute('data-u')); if (it && t.files && t.files.length) { handleFiles(it, t.files); t.value = ''; } }
    return;
  }
  if (t.id === 'dfPeriod') { S.dFilter.period = t.value; applyPeriod(); $('dfFrom').value = toISO(S.dFilter.from); $('dfTo').value = toISO(S.dFilter.to); }
  else if (t.id === 'dfFrom') { S.dFilter.from = toDMY(t.value); S.dFilter.period = 'custom'; $('dfPeriod').value = 'custom'; }
  else if (t.id === 'dfTo') { S.dFilter.to = toDMY(t.value); S.dFilter.period = 'custom'; $('dfPeriod').value = 'custom'; }
  else if (t.id === 'dfDiv') { S.dFilter.divisi = t.value; }
  else if (t.id === 'lfFrom') { S.rFilter.from = toDMY(t.value); loadReports(true); }
  else if (t.id === 'lfTo') { S.rFilter.to = toDMY(t.value); loadReports(true); }
  else if (t.id === 'lfDiv') { S.rFilter.divisi = t.value; loadReports(true); }
  else if (t.id === 'lfStatus') { S.rFilter.status = t.value; loadReports(true); }
  else if (t.id === 'pfFile') { if (t.files && t.files[0]) { uploadProfilePhoto(t.files[0]); t.value = ''; } }
  else if (t.id === 'umFile') { if (t.files && t.files[0]) { uploadUserPhoto(t.files[0]); t.value = ''; } }
  else if (t.id === 'lfMine') { S.rFilter.mine = t.value; loadReports(true); }
  else if (t.id === 'rkBulan') { var bl = ymToBulan(t.value); if (bl) { S.rk.bulan = bl; loadRekap(); } }
  else if (t.id === 'rkMode') { S.rk.mode = t.value; if (S.rk.data) { fillRekap(); } }
  else if (t.id === 'rkDiv') { S.rk.divisi = t.value; loadRekap(); }
  else if (t.id === 'ufDiv') { S.uFilter.divisi = t.value; loadUsers(true); }
  else if (t.id === 'ufStatus') { S.uFilter.status = t.value; loadUsers(true); }
});
var searchTimer = null;
document.addEventListener('input', function (e) {
  var t = e.target;
  if (!t || (t.id !== 'lfSearch' && t.id !== 'ufSearch')) { return; }
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function () {
    if (t.id === 'lfSearch') { S.rFilter.search = t.value.trim(); loadReports(true); }
    else { S.uFilter.search = t.value.trim(); loadUsers(true); }
  }, 350);
});

// =====================================================================
// BOOT
// =====================================================================
(function boot() {
  paintIcons();
  $('loginLogo').src = LOGO_SRC;
  $('sideLogo').src = LOGO_SRC;
  $('lgToggle').onclick = function () {
    var p = $('lgPass');
    p.type = p.type === 'password' ? 'text' : 'password';
    this.textContent = p.type === 'password' ? 'Lihat' : 'Sembunyi';
  };
  if (!IS_GAS) {
    // Mode preview Canvas: backend tidak tersedia, tampilkan UI kosong
    $('lgPreview').hidden = false;
    $('lgPreview').onclick = function () {
      S.user = { id: 'PREVIEW', username: 'admin', role: 'Admin', nama: 'Administrator', divisi: '-', jabatan: '-' };
      enterApp();
    };
    showLogin();
    return;
  }
  var tk = load('bmi_token');
  if (!tk) { showLogin(); return; }
  S.token = tk;
  callApi('me', {}, function (res) {
    if (res.ok) { S.user = res.user; S.cfg = res.cfg; enterApp(); }
    else { S.token = ''; store('bmi_token', null); showLogin(); }
  });
})();
</script>
