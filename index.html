<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b0f19">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Web App Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* Reset dasar untuk memastikan tampilan layar penuh tanpa scrollbar ganda */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #0b0f19;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #f1f5f9;
      -webkit-tap-highlight-color: transparent;
    }

    /* Kontainer utama pembungkus iframe */
    .app-container {
      position: relative;
      width: 100%;
      height: 100%;
      height: 100dvh;
      background-color: #0b0f19;
    }

    /* Elemen iframe fullscreen menuju URL Google Apps Script */
    #gas-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
      background-color: #0b0f19;
      opacity: 0;
      transition: opacity 0.45s ease-in-out;
    }

    #gas-frame.loaded {
      opacity: 1;
    }

    /* Layar Splash Loading dengan gaya Zettbos Glassmorphism */
    #splash-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(circle at top right, rgba(0, 255, 170, 0.08), transparent 45%),
                  radial-gradient(circle at bottom left, rgba(21, 27, 38, 0.9), #0b0f19 75%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    #splash-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* Kartu status pemuatan */
    .loader-card {
      width: 100%;
      max-width: 340px;
      padding: 28px 24px;
      border-radius: 20px;
      background: rgba(21, 27, 38, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45), 0 0 24px rgba(0, 255, 170, 0.06);
      text-align: center;
    }

    /* Animasi Spinner Neon Green */
    .spinner-wrap {
      position: relative;
      width: 52px;
      height: 52px;
      margin: 0 auto 18px auto;
    }

    .spinner-ring {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: 3px solid rgba(0, 255, 170, 0.14);
      border-top-color: #00ffaa;
      animation: spin 0.9s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
    }

    .spinner-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background-color: #00ffaa;
      box-shadow: 0 0 12px #00ffaa;
      animation: pulse 1.4s ease-in-out infinite;
    }

    .loader-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: #f8fafc;
      margin-bottom: 6px;
    }

    .loader-subtitle {
      font-size: 13px;
      line-height: 1.5;
      color: #94a3b8;
    }

    /* Panel tombol bantuan jika loading terlalu lama / timeout */
    #fallback-actions {
      display: none;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      flex-direction: column;
      gap: 10px;
    }

    #fallback-actions.visible {
      display: flex;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 11px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: transform 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background-color: #00ffaa;
      color: #0b0f19;
      box-shadow: 0 4px 16px rgba(0, 255, 170, 0.25);
    }

    .btn-primary:hover {
      background-color: #33ffbb;
      box-shadow: 0 6px 22px rgba(0, 255, 170, 0.38);
    }

    .btn-secondary {
      background-color: rgba(255, 255, 255, 0.06);
      color: #e2e8f0;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-secondary:hover {
      background-color: rgba(255, 255, 255, 0.12);
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.55; transform: translate(-50%, -50%) scale(0.9); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.15); }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Overlay Loading Awal -->
    <div id="splash-overlay" role="status" aria-live="polite">
      <div class="loader-card">
        <div class="spinner-wrap">
          <div class="spinner-ring"></div>
          <div class="spinner-dot"></div>
        </div>
        <h1 class="loader-title">Memuat Aplikasi...</h1>
        <p id="status-text" class="loader-subtitle">Menghubungkan ke server Google Apps Script, mohon tunggu sebentar.</p>

        <!-- Aksi Darurat jika server lambat atau iframe diblokir -->
        <div id="fallback-actions">
          <button type="button" id="btn-reload" class="btn btn-primary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"></path>
              <path d="M21 3v5h-5"></path>
            </svg>
            Muat Ulang Halaman
          </button>
          <a id="btn-direct" href="https://script.google.com/macros/s/AKfycbzpMWdJSgSK-9JJIqYKfO_nOMYFMpgd71USE1y4IdipEGj89DZ8Ww2JhD4lgggaWHPw/exec" target="_top" rel="noopener noreferrer" class="btn btn-secondary">
            Buka Tautan Langsung
          </a>
        </div>
      </div>
    </div>

    <!-- Iframe Utama -->
    <iframe
      id="gas-frame"
      title="Google Apps Script Web App"
      allow="camera; microphone; geolocation; clipboard-read; clipboard-write; fullscreen"
      allowfullscreen>
    </iframe>
  </div>

  <script>
    (function () {
      // URL Target Google Apps Script Web App
      var GAS_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzpMWdJSgSK-9JJIqYKfO_nOMYFMpgd71USE1y4IdipEGj89DZ8Ww2JhD4lgggaWHPw/exec';
      var TIMEOUT_MS = 12000;

      var iframeEl = document.getElementById('gas-frame');
      var splashEl = document.getElementById('splash-overlay');
      var statusTextEl = document.getElementById('status-text');
      var fallbackEl = document.getElementById('fallback-actions');
      var btnReload = document.getElementById('btn-reload');
      var btnDirect = document.getElementById('btn-direct');

      var loadTimer = null;
      var isLoaded = false;

      // Pastikan tombol tautan langsung sinkron dengan URL utama
      if (btnDirect) {
        btnDirect.setAttribute('href', GAS_WEB_APP_URL);
      }

      // Fungsi untuk memulai atau mengulang pemuatan iframe
      function loadWebApp(forceCacheBust) {
        try {
          isLoaded = false;
          iframeEl.classList.remove('loaded');
          splashEl.classList.remove('hidden');
          fallbackEl.classList.remove('visible');
          statusTextEl.textContent = 'Menghubungkan ke server Google Apps Script, mohon tunggu sebentar.';

          // Teruskan query parameter dari URL GitHub Pages ke URL Apps Script jika ada
          var currentSearch = window.location.search || '';
          var targetUrl = GAS_WEB_APP_URL + currentSearch;

          if (forceCacheBust) {
            var separator = targetUrl.indexOf('?') !== -1 ? '&' : '?';
            targetUrl = targetUrl + separator + '_ts=' + String(new Date().getTime());
          }

          iframeEl.src = targetUrl;

          // Bersihkan timer sebelumnya jika ada
          if (loadTimer) {
            clearTimeout(loadTimer);
          }

          // Tampilkan opsi bantuan jika pemuatan melewati batas waktu
          loadTimer = setTimeout(function () {
            if (!isLoaded) {
              statusTextEl.textContent = 'Koneksi membutuhkan waktu lebih lama dari biasanya. Pastikan pengaturan XFrameOptionsMode di Apps Script sudah ALLOWALL.';
              fallbackEl.classList.add('visible');
            }
          }, TIMEOUT_MS);
        } catch (err) {
          statusTextEl.textContent = 'Terjadi kendala saat memuat aplikasi: ' + err.message;
          fallbackEl.classList.add('visible');
        }
      }

      // Event saat iframe selesai dimuat
      iframeEl.addEventListener('load', function () {
        // Abaikan event load kosong sebelum src ditetapkan
        if (!iframeEl.getAttribute('src')) {
          return;
        }
        isLoaded = true;
        if (loadTimer) {
          clearTimeout(loadTimer);
        }
        iframeEl.classList.add('loaded');
        splashEl.classList.add('hidden');
      });

      // Event tombol muat ulang
      btnReload.addEventListener('click', function () {
        loadWebApp(true);
      });

      // Jalankan pemuatan pertama kali saat DOM siap
      loadWebApp(false);
    })();
  </script>
</body>
</html>
