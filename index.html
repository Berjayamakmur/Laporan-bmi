<!-- === FILE: index.html === -->
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f19">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Web App Portal</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    /* Container Frame Full-Screen */
    .app-viewport {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      background: #0b0f19;
      z-index: 1;
    }

    iframe#gasFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      opacity: 0;
      transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1);
      background-color: #0b0f19;
    }

    iframe#gasFrame.is-ready {
      opacity: 1;
    }

    /* Overlay Splash Screen & Fallback dengan Tema Zettbos Dark Glassmorphism */
    .overlay-screen {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at 50% 20%, rgba(0, 255, 170, 0.08), transparent 60%), #0b0f19;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }

    .overlay-screen.is-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .glass-card {
      width: 100%;
      max-width: 380px;
      padding: 32px 24px;
      border-radius: 20px;
      background: rgba(21, 27, 38, 0.78);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 255, 170, 0.18);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55), 0 0 24px rgba(0, 255, 170, 0.06);
      text-align: center;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }

    .glass-card:hover {
      border-color: rgba(0, 255, 170, 0.35);
    }

    /* Neon Spinner */
    .spinner-ring {
      width: 48px;
      height: 48px;
      margin: 0 auto 20px auto;
      border-radius: 50%;
      border: 3px solid rgba(0, 255, 170, 0.15);
      border-top-color: #00ffaa;
      box-shadow: 0 0 15px rgba(0, 255, 170, 0.25);
      animation: spin 0.85s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      margin-bottom: 14px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: #00ffaa;
      background: rgba(0, 255, 170, 0.1);
      border: 1px solid rgba(0, 255, 170, 0.25);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #00ffaa;
      box-shadow: 0 0 8px #00ffaa;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .card-desc {
      font-size: 13.5px;
      line-height: 1.55;
      color: #94a3b8;
      margin-bottom: 22px;
    }

    /* Tombol Interaktif dengan Micro-Interactions */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px 18px;
      border-radius: 12px;
      border: none;
      background: #00ffaa;
      color: #0b0f19;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
    }

    .btn-primary:hover {
      background: #2bffb8;
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0, 255, 170, 0.35);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .btn-primary:focus-visible,
    .btn-secondary:focus-visible {
      outline: 2px solid #00ffaa;
      outline-offset: 3px;
    }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 11px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.04);
      color: #e2e8f0;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.09);
      border-color: rgba(0, 255, 170, 0.4);
      transform: translateY(-1px);
    }

    .hidden-el {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Splash Screen Pemuatan Awal -->
  <div id="loaderOverlay" class="overlay-screen" role="status" aria-live="polite">
    <div class="glass-card">
      <div class="spinner-ring"></div>
      <div class="status-badge">
        <span class="status-dot"></span>
        <span>Menghubungkan Server</span>
      </div>
      <h1 class="card-title">Memuat Aplikasi...</h1>
      <p class="card-desc">Menyiapkan ruang kerja layar penuh dari Google Apps Script. Mohon tunggu sebentar.</p>
      <div id="slowConnectionBox" class="btn-group hidden-el">
        <a id="directOpenBtn" href="https://script.google.com/macros/s/AKfycbzpMWdJSgSK-9JJIqYKfO_nOMYFMpgd71USE1y4IdipEGj89DZ8Ww2JhD4lgggaWHPw/exec" target="_blank" rel="noopener noreferrer" class="btn-primary">
          Buka Langsung di Tab Baru
        </a>
        <button type="button" id="retryBtn" class="btn-secondary">
          Muat Ulang Halaman
        </button>
      </div>
    </div>
  </div>

  <!-- Viewport Utama Full-Screen -->
  <main class="app-viewport">
    <iframe
      id="gasFrame"
      title="Google Apps Script Web App"
      allow="geolocation; microphone; camera; clipboard-read; clipboard-write"
      allowfullscreen="true"
      loading="eager">
    </iframe>
  </main>

  <script>
    (function () {
      // Endpoint Web App Google Apps Script target
      var BASE_GAS_URL = 'https://script.google.com/macros/s/AKfycbzpMWdJSgSK-9JJIqYKfO_nOMYFMpgd71USE1y4IdipEGj89DZ8Ww2JhD4lgggaWHPw/exec';

      // Ekstrak elemen DOM menjadi referensi variabel terkontrol
      var frameEl = document.getElementById('gasFrame');
      var overlayEl = document.getElementById('loaderOverlay');
      var slowBoxEl = document.getElementById('slowConnectionBox');
      var directBtnEl = document.getElementById('directOpenBtn');
      var retryBtnEl = document.getElementById('retryBtn');

      var isLoaded = false;
      var fallbackTimer = null;

      // Rakit URL target dengan meneruskan parameter query primitif jika ada
      function buildTargetUrl() {
        var rawSearch = String(window.location.search || '');
        if (rawSearch.length > 1 && rawSearch.charAt(0) === '?') {
          return BASE_GAS_URL + rawSearch;
        }
        return BASE_GAS_URL;
      }

      // Sembunyikan layar splash dan tampilkan frame secara mulus
      function revealAppFrame() {
        if (isLoaded) {
          return;
        }
        isLoaded = true;
        if (fallbackTimer) {
          clearTimeout(fallbackTimer);
        }
        frameEl.classList.add('is-ready');
        overlayEl.classList.add('is-hidden');
      }

      // Inisialisasi pemuatan iframe
      function initWrapper() {
        isLoaded = false;
        slowBoxEl.classList.add('hidden-el');
        overlayEl.classList.remove('is-hidden');
        frameEl.classList.remove('is-ready');

        var finalUrl = buildTargetUrl();
        directBtnEl.setAttribute('href', finalUrl);
        frameEl.setAttribute('src', finalUrl);

        // Tampilkan opsi fallback jika koneksi lambat atau iframe diblokir X-Frame-Options
        if (fallbackTimer) {
          clearTimeout(fallbackTimer);
        }
        fallbackTimer = setTimeout(function () {
          if (!isLoaded) {
            slowBoxEl.classList.remove('hidden-el');
          }
        }, 7000);
      }

      // Event listener saat iframe selesai dimuat
      frameEl.addEventListener('load', function () {
        revealAppFrame();
      });

      // Tombol muat ulang
      retryBtnEl.addEventListener('click', function () {
        initWrapper();
      });

      // Proteksi lingkungan Google Apps Script / Gemini Canvas Friendly
      if (typeof google !== 'undefined' && google.script && google.script.run) {
        // Berjalan di dalam kontainer GAS langsung
        initWrapper();
      } else {
        // Berjalan di lingkungan statis GitHub Pages atau Gemini Canvas Preview
        initWrapper();
      }
    })();
  </script>
</body>
</html>
